name: Transformar Encuesta Especial

on:
  # Ejecucion manual desde la pestaña Actions.
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo de ejecucion"
        type: choice
        required: true
        default: incremental
        options:
          - incremental
          - total
      dry_run:
        description: "Solo calcular, sin escribir"
        type: boolean
        required: false
        default: false

  # Gatillo externo (cron-job.org). El event_type define el modo:
  #   {"event_type": "incremental"}  o  {"event_type": "total"}
  repository_dispatch:
    types:
      - incremental
      - total

  # Respaldo nativo, por si cron-job.org falla. Las horas van en UTC y GitHub
  # no respeta el horario de Chile: en horario de verano (UTC-3) estas horas
  # equivalen a 08:00 y cada 2h; en invierno (UTC-4) corren una hora antes.
  # Descomentar solo si se quiere el respaldo.
  # schedule:
  #   - cron: "0 11,13,15,17,19,21 * * *"   # incremental
  #   - cron: "30 5 * * *"                  # total

concurrency:
  group: transformar-encuesta-especial
  cancel-in-progress: false

jobs:
  transformar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar credencial
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::error::El secret GCP_SA_KEY llego vacio al job."
            echo ""
            echo "Revisar, en este orden:"
            echo "  1. Que este en Settings > Secrets and variables > Actions,"
            echo "     pestaña SECRETS (no la pestaña Variables)."
            echo "  2. Que sea un Repository secret y no un Environment secret"
            echo "     (los de environment requieren declarar 'environment:' en el job)."
            echo "  3. Que el nombre sea exactamente GCP_SA_KEY, sin espacios."
            echo "  4. Si es un secret de organizacion, que este repositorio este"
            echo "     en su lista de repos con acceso."
            exit 1
          fi
          echo "Secret recibido: ${#GCP_SA_KEY} caracteres"
          python - <<'PY'
          import json, os, sys
          try:
              datos = json.loads(os.environ["GCP_SA_KEY"])
          except json.JSONDecodeError as error:
              print(f"::error::GCP_SA_KEY no es un JSON valido: {error}")
              print("Pegar el contenido completo del archivo .json de la llave,")
              print("incluyendo las llaves { } de apertura y cierre.")
              sys.exit(1)
          faltantes = [c for c in ("client_email", "private_key", "project_id")
                       if c not in datos]
          if faltantes:
              print(f"::error::Al JSON le faltan campos: {', '.join(faltantes)}")
              sys.exit(1)
          print(f"Proyecto        : {datos['project_id']}")
          print(f"Service account : {datos['client_email']}")
          print("Compartir ambas planillas con ese correo:")
          print("  origen  -> Lector")
          print("  destino -> Editor")
          PY

      - name: Determinar modo
        id: modo
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch)
              MODO="${{ github.event.inputs.modo }}"
              DRY="${{ github.event.inputs.dry_run }}"
              ;;
            repository_dispatch)
              MODO="${{ github.event.action }}"
              DRY="false"
              ;;
            schedule)
              if [ "${{ github.event.schedule }}" = "30 5 * * *" ]; then
                MODO="total"
              else
                MODO="incremental"
              fi
              DRY="false"
              ;;
            *)
              MODO="incremental"
              DRY="false"
              ;;
          esac
          echo "modo=$MODO" >> "$GITHUB_OUTPUT"
          echo "dry=$DRY" >> "$GITHUB_OUTPUT"
          echo "Ejecutando en modo: $MODO (dry_run=$DRY)"

      - name: Ejecutar transformacion
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          EXTRA=""
          if [ "${{ steps.modo.outputs.dry }}" = "true" ]; then
            EXTRA="--dry-run"
          fi
          python transformar.py --modo "${{ steps.modo.outputs.modo }}" $EXTRA
